<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:system-ui,-apple-system,sans-serif;}
#cvwrap{position:relative;width:100%;height:60vh;min-height:400px;border-radius:12px;border:1.5px solid #e8e8e8;overflow:hidden;}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#a32d2d;font-size:14px;padding:20px;text-align:center;}
.fml{font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:6px 0;font-family:ui-monospace,monospace;line-height:1.8;}
.row{display:flex;align-items:center;gap:9px;margin:6px 0;flex-wrap:wrap;}
.pill{font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 14px;white-space:nowrap;}
.btn{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#fff;color:#2c2c2a;}
.btn.on{border-color:#185fa5;background:#e6f1fb;color:#185fa5;}
.val{min-width:56px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:5px 10px;}
.info{font-size:12px;padding:8px 14px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#555;margin:6px 0;font-family:ui-monospace,monospace;line-height:1.7;}
input[type=range]{flex:1;min-width:120px;}
</style>

<div id="cvwrap"><div id="fallback">Impossible de charger la librairie 3D (Three.js). Vérifie la connexion internet — sur GitHub Pages cela fonctionnera.</div></div>
<div class="fml"><b style="color:#7F77DD">ā×b̄</b> — les doigts pointent selon <b style="color:#E24B4A">ā</b> et s'enroulent vers <b style="color:#378ADD">b̄</b> ; le <b>pouce</b> donne <b style="color:#7F77DD">ā×b̄</b>. ‖ā×b̄‖ = ā·b̄·sinθ</div>

<div class="row">
  <span class="pill" style="color:#BA7517;border-color:#f5c88f;">angle θ (ā, b̄)</span>
  <input type="range" id="th" min="10" max="170" value="70" step="1" style="accent-color:#BA7517;max-width:200px;">
  <span class="val" id="thv" style="color:#BA7517;border-color:#f5c88f;">70°</span>
  <button class="btn on" id="bAnim" onclick="animOn=!animOn;this.className=animOn?'btn on':'btn';">Fermer les doigts</button>
  <button class="btn" id="bMode" onclick="toggleDrag()">Tourner : la vue</button>
  <span class="pill">Zoom</span>
  <button class="btn" onclick="zoomCam(1/1.15)">−</button>
  <button class="btn" onclick="zoomCam(1.15)">＋</button>
</div>
<div class="info" id="info">🖱 glisse pour tourner autour, molette pour zoomer.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let animOn=true,thDeg=70,dragMode='camera';
document.getElementById('th').addEventListener('input',e=>{thDeg=+e.target.value;document.getElementById('thv').textContent=thDeg+'°';});
let camR=5.6,camTheta=0.62,camPhi=1.12,zoomCam=f=>{camR=Math.max(3,Math.min(11,camR*f));};
function toggleDrag(){dragMode=dragMode==='camera'?'hand':'camera';const b=document.getElementById('bMode');
  b.textContent=dragMode==='hand'?'Tourner : la main':'Tourner : la vue';b.className=dragMode==='hand'?'btn on':'btn';}

(function(){
if(typeof THREE==='undefined'){document.getElementById('fallback').style.display='flex';return;}
const wrap=document.getElementById('cvwrap');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(45,wrap.clientWidth/wrap.clientHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(window.devicePixelRatio||1);
renderer.setSize(wrap.clientWidth,wrap.clientHeight);wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.62));
const dl=new THREE.DirectionalLight(0xffffff,0.85);dl.position.set(3,5,4);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.3);dl2.position.set(-3,2,-3);scene.add(dl2);

// sol grille
const grid=new THREE.GridHelper(6,12,0xdfe2e6,0xf0f2f4);grid.position.y=-1.6;scene.add(grid);

const skinMat=new THREE.MeshStandardMaterial({color:0xecb98e,roughness:0.75,metalness:0.02});
const nailMat=new THREE.MeshStandardMaterial({color:0xf5ddc7,roughness:0.5});

// ---- os arrondi le long de +x ----
function bone(len,rad){const g=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(rad*0.92,rad,len,18),skinMat);
  cyl.rotation.z=-Math.PI/2;cyl.position.x=len/2;g.add(cyl);
  const s0=new THREE.Mesh(new THREE.SphereGeometry(rad,16,16),skinMat);g.add(s0);
  const s1=new THREE.Mesh(new THREE.SphereGeometry(rad*0.96,16,16),skinMat);s1.position.x=len;g.add(s1);
  return g;}
// ---- doigt : 3 phalanges articulées ----
function finger(lens,rad){
  const j0=new THREE.Group();j0.add(bone(lens[0],rad));
  const j1=new THREE.Group();j1.position.x=lens[0];j0.add(j1);j1.add(bone(lens[1],rad*0.9));
  const j2=new THREE.Group();j2.position.x=lens[1];j1.add(j2);j2.add(bone(lens[2],rad*0.8));
  const nail=new THREE.Mesh(new THREE.SphereGeometry(rad*0.55,12,12),nailMat);nail.position.x=lens[2];j2.add(nail);
  return {root:j0,joints:[j0,j1,j2]};}

const system=new THREE.Group();scene.add(system);
const hand=new THREE.Group();system.add(hand);

// ---- paume : rectangle arrondi extrudé (plat) ----
function roundRect(w,h,r){const s=new THREE.Shape();
  s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s;}
const palmGeo=new THREE.ExtrudeGeometry(roundRect(0.95,0.8,0.22),{depth:0.16,bevelEnabled:true,bevelThickness:0.06,bevelSize:0.06,bevelSegments:4,steps:1});
palmGeo.center();
const palm=new THREE.Mesh(palmGeo,skinMat);palm.rotation.x=Math.PI/2;hand.add(palm);   // plat dans le plan xz, faces internes ±y
// petit renflement (base des doigts)
const knuck=new THREE.Mesh(new THREE.SphereGeometry(0.46,20,16),skinMat);knuck.scale.set(0.9,0.42,0.5);knuck.position.set(0.34,0,0);hand.add(knuck);

// avant-bras
const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.34,0.9,20),skinMat);arm.rotation.z=Math.PI/2;arm.position.set(-0.85,0,0);hand.add(arm);

// 4 doigts au bord +x
const fingers=[];const fz=[-0.28,-0.095,0.095,0.28];const flen=[[0.34,0.27,0.22],[0.38,0.30,0.24],[0.36,0.29,0.23],[0.30,0.24,0.19]];
for(let i=0;i<4;i++){const F=finger(flen[i],0.115);F.root.position.set(0.46,0,fz[i]);hand.add(F.root);fingers.push(F);}

// POUCE : part du côté (−y) et pointe vers +z (= ā×b̄)
const thumb=finger([0.36,0.30],0.14);
const thumbPivot=new THREE.Group();thumbPivot.position.set(0.06,0.05,0.44);   // au bord +z (côté de la paume)
thumbPivot.rotation.set(0.45,-Math.PI/2,0);   // phalanges orientées vers +z (= ā×b̄)
thumbPivot.add(thumb.root);hand.add(thumbPivot);

// ---- vecteurs (flèches 3D) ----
const ORIG=new THREE.Vector3(0,0,0);
function arrow(dir,len,color){return new THREE.ArrowHelper(dir.clone().normalize(),ORIG,len,color,0.28,0.16);}
const aArr=arrow(new THREE.Vector3(1,0,0),1.9,0xE24B4A);system.add(aArr);
const bArr=arrow(new THREE.Vector3(1,0,0),1.9,0x378ADD);system.add(bArr);
const mArr=arrow(new THREE.Vector3(0,0,1),1.5,0x7F77DD);system.add(mArr);

// étiquettes
function label(txt,color){const c=document.createElement('canvas');c.width=128;c.height=72;const x=c.getContext('2d');
  x.fillStyle=color;x.font='bold 46px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,64,38);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  sp.scale.set(0.8,0.45,1);system.add(sp);return sp;}
const laA=label('ā','#E24B4A'),laB=label('b̄','#378ADD'),laM=label('ā×b̄','#7F77DD');

// ---- interaction : orbite + zoom (PAS de rotation auto) ----
let drag=null;
renderer.domElement.style.cursor='grab';
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.style.cursor='grabbing';});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(dragMode==='hand'){system.rotateOnWorldAxis(new THREE.Vector3(0,1,0),dx*0.01);system.rotateOnWorldAxis(new THREE.Vector3(1,0,0),dy*0.01);}
  else{camTheta-=dx*0.006;camPhi=Math.max(0.2,Math.min(2.9,camPhi-dy*0.006));}
  drag={x:e.clientX,y:e.clientY};});
window.addEventListener('pointerup',()=>{drag=null;renderer.domElement.style.cursor='grab';});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoomCam(e.deltaY<0?1/1.1:1.1);},{passive:false});

function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

let t=0;
function tick(){
  const thr=thDeg*Math.PI/180;
  // b̄ dans le plan xy à l'angle θ ; ā×b̄ selon +z, longueur ∝ sinθ
  bArr.setDirection(new THREE.Vector3(Math.cos(thr),Math.sin(thr),0));
  const Mmag=Math.sin(thr);mArr.setLength(Math.max(0.25,1.7*Math.abs(Mmag)),0.28,0.16);
  // enroulement des doigts (animation, sans tourner la main)
  if(animOn)t+=0.03;const curl=(Math.sin(t)*0.5+0.5)*1.25+0.06;
  fingers.forEach(F=>F.joints.forEach((j,k)=>{j.rotation.z=curl*(k===0?0.85:1.15);}));
  thumb.joints.forEach((j,k)=>j.rotation.z=0.12+curl*0.05);
  // caméra
  camera.position.set(camR*Math.sin(camPhi)*Math.cos(camTheta),camR*Math.cos(camPhi),camR*Math.sin(camPhi)*Math.sin(camTheta));
  camera.lookAt(0,0,0);
  // placer les étiquettes au bout des flèches
  laA.position.set(2.1,0,0);
  laB.position.set(2.1*Math.cos(thr),2.1*Math.sin(thr),0);
  laM.position.set(0,0,Math.max(0.4,1.9*Math.abs(Mmag)));
  document.getElementById('info').innerHTML='‖ā×b̄‖ = sinθ = <b style="color:#7F77DD">'+Mmag.toFixed(2)+'</b> (max à 90°). 🖱 glisse pour tourner, molette pour zoomer.';
  renderer.render(scene,camera);requestAnimationFrame(tick);}
resize();tick();
})();
</script>
